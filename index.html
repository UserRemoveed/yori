<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Кастомный Эмбед</title>

    <!-- НАСТРОЙКА ЭМБЕДА ДЛЯ ДИСКОРДА -->
    <!-- Главный заголовок (жирный текст сверху) -->
    <meta property="og:title" content="Занято By ! ᥒᥱ᥊𐔖rᥲ" />
    
    <!-- Описание (текст ниже заголовка) -->
    <meta property="og:description" content="You can view and join @yori_groop right away." />
    
    <!-- Имя "автора" или сайта (маленький текст в самом верху, как "Telegram") -->
    <meta property="og:site_name" content="My Custom Redirect" />
    
    <!-- Ссылка на картинку/аватарку, если хочешь, чтобы она была в превью -->
    <meta property="og:image" content="https://твой-сайт.ком/avatar.png" />
    
    <!-- Цвет полоски сбоку (в HEX формате, например #7289DA — это цвет Дискорда) -->
    <meta name="theme-color" content="#ff0055" />

    <!-- КОРРЕКТНЫЙ ТИП ДЛЯ ОТОБРАЖЕНИЯ -->
    <meta property="og:type" content="website" />

    <!-- Автоматический редирект (перенаправление) -->
